<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍩 Donut Club </title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --text: #f0e6d3;
            --pink: #ff6b9d;
            --glaze: #f7c5cc;
            --chocolate: #6b3a2e;
            --sprinkle-yellow: #ffe259;
            --sprinkle-blue: #56ccf2;
            --sprinkle-green: #7bed9f;
            --sprinkle-purple: #c471ed;
            --sprinkle-orange: #ff9a56;
            --sprinkle-white: #ffffff;
            --card-hover: #1e2d50;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --glow-pink: 0 0 40px rgba(255, 107, 157, 0.3);
            --glow-blue: 0 0 40px rgba(86, 204, 242, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            cursor: default;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ============ ANIMATED BACKGROUND SPRINKLES ============ */
        #sprinkles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ============ MAIN CONTAINER ============ */
        .main-container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        /* ============ HEADER ============ */
        .header {
            text-align: center;
            padding: 40px 20px 20px;
            position: relative;
        }

        .donut-logo {
            display: inline-block;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: floatDonut 3s ease-in-out infinite;
        }

        .donut-logo:active {
            transform: scale(0.9);
        }

        @keyframes floatDonut {
            0%,
            100% {
                transform: translateY(0px);
            }
            30% {
                transform: translateY(-18px);
            }
            60% {
                transform: translateY(-6px);
            }
            85% {
                transform: translateY(-14px);
            }
        }

        .donut-logo svg {
            width: 100px;
            height: 100px;
            filter: drop-shadow(0 10px 30px rgba(255, 107, 157, 0.5));
            transition: filter 0.4s;
        }

        .donut-logo:hover svg {
            filter: drop-shadow(0 14px 40px rgba(255, 107, 157, 0.75));
        }

        /* Frosting drip on the donut SVG */
        .frosting-drip {
            animation: dripPulse 2s ease-in-out infinite;
            transform-origin: top center;
        }
        @keyframes dripPulse {
            0%,
            100% {
                d: path('M 35 48 Q 35 52 38 54 Q 41 56 38 60');
            }
            50% {
                d: path('M 35 48 Q 35 52 38 55 Q 41 58 38 63');
            }
        }

        .title {
            font-size: clamp(2.4rem, 6vw, 3.6rem);
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ff6b9d, #ff9a56, #ff6b9d, #c471ed);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease-in-out infinite;
            margin-top: 8px;
        }

        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            25% {
                background-position: 100% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            75% {
                background-position: 0% 100%;
            }
        }

        .subtitle {
            font-size: 1.1rem;
            color: #c9b8a8;
            margin-top: 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .tagline {
            font-size: 0.9rem;
            color: #8a7b6e;
            margin-top: 6px;
            font-style: italic;
        }

        /* ============ CLOCK / GREETING ============ */
        .greeting-bar {
            text-align: center;
            margin: 10px 0 20px;
            font-size: 1rem;
            color: #b8a594;
            letter-spacing: 1px;
            transition: all 0.5s;
        }
        .greeting-bar .time {
            font-weight: 700;
            color: #ff6b9d;
            font-size: 1.3rem;
        }

        /* ============ SEARCH / FILTER ============ */
        .search-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 28px;
            position: relative;
            z-index: 2;
        }
        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 14px 22px;
            padding-left: 48px;
            border-radius: 50px;
            border: 2px solid rgba(255, 107, 157, 0.35);
            background: rgba(22, 33, 62, 0.8);
            backdrop-filter: blur(10px);
            color: #f0e6d3;
            font-size: 1rem;
            letter-spacing: 0.5px;
            transition: all 0.35s;
            outline: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }
        .search-input::placeholder {
            color: #6b5e52;
            letter-spacing: 1px;
        }
        .search-input:focus {
            border-color: #ff6b9d;
            box-shadow: 0 0 0 6px rgba(255, 107, 157, 0.1), 0 8px 30px rgba(0, 0, 0, 0.35);
            background: rgba(30, 45, 80, 0.9);
        }
        .search-icon {
            position: absolute;
            left: calc(50% - 230px);
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            pointer-events: none;
            z-index: 3;
            color: #8a7b6e;
            transition: color 0.3s;
        }
        @media (max-width: 600px) {
            .search-icon {
                left: 28px;
            }
            .search-input {
                padding-left: 44px;
            }
        }
        .search-input:focus~.search-icon,
        .search-wrap:focus-within .search-icon {
            color: #ff6b9d;
        }

        /* ============ PROJECT GRID ============ */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .project-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px 22px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .project-card:hover {
            background: var(--card-hover);
            border-color: rgba(255, 107, 157, 0.4);
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), var(--glow-pink);
            z-index: 5;
        }
        .project-card:active {
            transform: scale(0.97);
            transition: transform 0.15s;
        }

        /* Sprinkle accent on card */
        .project-card::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 107, 157, 0.25) 0%, transparent 70%);
            pointer-events: none;
            transition: all 0.5s;
            opacity: 0.6;
        }
        .project-card:hover::before {
            top: -20px;
            right: -20px;
            width: 100px;
            height: 100px;
            opacity: 0.9;
            background: radial-gradient(circle, rgba(255, 154, 86, 0.35) 0%, transparent 70%);
        }

        /* Sprinkles dots on card */
        .card-sprinkles {
            position: absolute;
            top: 12px;
            right: 16px;
            display: flex;
            gap: 5px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .project-card:hover .card-sprinkles {
            opacity: 1;
        }
        .card-sprinkle-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            animation: sprinklePop 0.5s ease-out forwards;
        }
        .card-sprinkle-dot:nth-child(1) {
            background: var(--sprinkle-yellow);
            animation-delay: 0s;
        }
        .card-sprinkle-dot:nth-child(2) {
            background: var(--sprinkle-blue);
            animation-delay: 0.07s;
        }
        .card-sprinkle-dot:nth-child(3) {
            background: var(--sprinkle-green);
            animation-delay: 0.14s;
        }
        .card-sprinkle-dot:nth-child(4) {
            background: var(--sprinkle-purple);
            animation-delay: 0.21s;
        }
        .card-sprinkle-dot:nth-child(5) {
            background: var(--sprinkle-orange);
            animation-delay: 0.28s;
        }

        @keyframes sprinklePop {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.6) rotate(180deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(360deg);
                opacity: 1;
            }
        }

        .project-icon {
            font-size: 2.2rem;
            transition: transform 0.4s;
            display: inline-block;
        }
        .project-card:hover .project-icon {
            transform: scale(1.2) rotate(-10deg);
        }

        .project-name {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.3px;
            color: #f5e6d3;
            position: relative;
            z-index: 1;
        }
        .project-desc {
            font-size: 0.85rem;
            color: #a89b8a;
            line-height: 1.4;
            position: relative;
            z-index: 1;
        }
        .project-link-hint {
            font-size: 0.75rem;
            color: #ff6b9d;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.35s;
            position: relative;
            z-index: 1;
        }
        .project-card:hover .project-link-hint {
            opacity: 1;
            transform: translateY(0);
        }

        /* ============ TOAST ============ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ff6b9d;
            color: #1a1a2e;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            letter-spacing: 0.5px;
            z-index: 999;
            pointer-events: none;
            box-shadow: 0 10px 35px rgba(255, 107, 157, 0.5);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 0.95rem;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ============ FOOTER ============ */
        .footer {
            text-align: center;
            padding: 30px 20px 10px;
            color: #5a4f44;
            font-size: 0.8rem;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        .footer span {
            color: #ff6b9d;
            font-weight: 700;
        }

        /* ============ THEME TOGGLE ============ */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(22, 33, 62, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 107, 157, 0.35);
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.35s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            color: #f0e6d3;
        }
        .theme-toggle:hover {
            border-color: #ff6b9d;
            box-shadow: 0 0 25px rgba(255, 107, 157, 0.35);
            transform: rotate(20deg);
        }
        .theme-toggle:active {
            transform: scale(0.9) rotate(-20deg);
        }

        /* ============ LIGHT MODE ============ */
        body.light {
            --bg: #fef9f3;
            --card-bg: #ffffff;
            --text: #3d2c1e;
            --card-hover: #fff5ee;
            --shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }
        body.light .project-desc {
            color: #7a6a5c;
        }
        body.light .project-name {
            color: #3d2c1e;
        }
        body.light .search-input {
            background: rgba(255, 255, 255, 0.8);
            color: #3d2c1e;
            border-color: rgba(255, 107, 157, 0.3);
        }
        body.light .search-input::placeholder {
            color: #b0a090;
        }
        body.light .greeting-bar {
            color: #8a7a6a;
        }
        body.light .greeting-bar .time {
            color: #e0557a;
        }
        body.light .subtitle {
            color: #7a6a5c;
        }
        body.light .tagline {
            color: #a09080;
        }
        body.light .footer {
            color: #a09080;
        }
        body.light .theme-toggle {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 107, 157, 0.3);
            color: #3d2c1e;
        }

        /* ============ SCROLLBAR ============ */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff6b9d55;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff6b9d99;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 600px) {
            .projects-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .header {
                padding: 20px 10px 10px;
            }
            .donut-logo svg {
                width: 70px;
                height: 70px;
            }
            .title {
                font-size: 2rem;
            }
            .project-card {
                padding: 18px 16px;
                border-radius: 16px;
            }
        }

        /* ============ RIPPLE EFFECT ============ */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 107, 157, 0.4);
            transform: scale(0);
            animation: rippleEffect 0.7s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleEffect {
            to {
                transform: scale(6);
                opacity: 0;
            }
        }

        /* ============ NO RESULTS ============ */
        .no-results {
            text-align: center;
            padding: 40px;
            color: #8a7b6e;
            font-size: 1.1rem;
            grid-column: 1 / -1;
            animation: fadeInUp 0.5s ease;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Canvas for floating sprinkles -->
    <canvas id="sprinkles-canvas"></canvas>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" title="Toggle light/dark mode" aria-label="Toggle theme">
        🌙
    </button>

    <!-- Main Container -->
    <div class="main-container">

        <!-- Header -->
        <header class="header">
            <div class="donut-logo" id="donutLogo" title="Click me! 🍩">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Outer donut body -->
                    <circle cx="50" cy="50" r="42" fill="#d4956b" stroke="#8b5e3c" stroke-width="3"/>
                    <!-- Inner hole -->
                    <circle cx="50" cy="50" r="16" fill="#1a1a2e" stroke="#8b5e3c" stroke-width="2"/>
                    <!-- Pink frosting -->
                    <path d="M 12 38 Q 8 50 14 62 Q 20 78 40 84 Q 55 88 65 80 Q 78 70 82 55 Q 88 40 80 28 Q 70 14 50 10 Q 30 8 18 22 Z"
                    fill="#ff6b9d" opacity="0.85"/>
                    <!-- Frosting drips -->
                    <path d="M 28 42 Q 26 50 30 55 Q 34 58 32 64" fill="#ff6b9d" stroke="#e0557a" stroke-width="1.5"
                        stroke-linecap="round" class="frosting-drip"/>
                    <path d="M 62 38 Q 60 46 64 52 Q 67 56 65 61" fill="#ff6b9d" stroke="#e0557a" stroke-width="1.5"
                        stroke-linecap="round" class="frosting-drip" style="animation-delay: 0.8s;"/>
                    <path d="M 74 50 Q 76 56 73 60 Q 70 64 72 68" fill="#ff6b9d" stroke="#e0557a" stroke-width="1.5"
                        stroke-linecap="round" class="frosting-drip" style="animation-delay: 1.6s;"/>
                    <!-- Sprinkles on frosting -->
                    <rect x="30" y="25" width="6" height="2.5" rx="1.2" fill="#ffe259" transform="rotate(25 33 26)"/>
                    <rect x="48" y="18" width="6" height="2.5" rx="1.2" fill="#56ccf2" transform="rotate(-15 51 19)"/>
                    <rect x="60" y="28" width="6" height="2.5" rx="1.2" fill="#7bed9f" transform="rotate(40 63 29)"/>
                    <rect x="38" y="20" width="6" height="2.5" rx="1.2" fill="#c471ed" transform="rotate(-30 41 21)"/>
                    <rect x="68" y="42" width="6" height="2.5" rx="1.2" fill="#ff9a56" transform="rotate(10 71 43)"/>
                    <rect x="22" y="45" width="6" height="2.5" rx="1.2" fill="#ffffff" transform="rotate(50 25 46)"/>
                    <rect x="55" y="48" width="6" height="2.5" rx="1.2" fill="#ffe259" transform="rotate(-40 58 49)"/>
                    <!-- Donut shine -->
                    <ellipse cx="35" cy="30" rx="10" ry="6" fill="white" opacity="0.15" transform="rotate(-20 35 30)"/>
                </svg>
            </div>
            <h1 class="title">Donut Club</h1>
            <p class="subtitle">🍩 Sweet Tools & Tasty Projects</p>
            <p class="tagline">— a freshly baked collection —</p>
        </header>

        <!-- Greeting & Clock -->
        <div class="greeting-bar" id="greetingBar">
            <span id="greetingText">Hello!</span> · <span class="time" id="liveTime">00:00</span>
        </div>

        <!-- Search -->
        <div class="search-wrap">
            <input type="text" class="search-input" id="searchInput" placeholder="Search projects...">
            <span class="search-icon">🔍</span>
        </div>

        <!-- Projects Grid -->
        <div class="projects-grid" id="projectsGrid">
            <!-- Cards injected by JS -->
        </div>

        <!-- Footer -->
        <div class="footer">
            Made with 🍩 & <span>Donut Club</span> · Click a card to visit
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ============ PROJECT DATA ============
            const projects = [{
                name: 'Tom the AI',
                desc: 'AI assistant tool',
                link: 'https://math12393.codeberg.page/Tom-The-Ai-Download/',
                icon: '🤖'
            }, {
                name: 'IPA Signer / IPA Editor',
                desc: 'iOS IPA signing tool',
                link: 'https://math12393.codeberg.page/IPA-SIGNER-WEN/',
                icon: '📱'
            }, {
                name: 'OMNI Encoder',
                desc: 'Max tools with Base64',
                link: 'https://math12393.codeberg.page/OMNI-ENCODER/',
                icon: '🔐'
            }, {
                name: 'Universal Extractor',
                desc: 'Extract/edit any file in browser',
                link: 'https://math12393.codeberg.page/Universal-Extractor/',
                icon: '📦'
            }, {
                name: 'NEXUS Architect',
                desc: 'Generate README, LICENSE, etc.',
                link: 'https://math12393.codeberg.page/Nexus-Architect/',
                icon: '🏗️'
            }, {
                name: 'AI Website Maker',
                desc: 'Instant site from HTML code',
                link: 'https://math12393.codeberg.page/Ai-Website-Maker/',
                icon: '🌐'
            }, {
                name: 'Global Chat',
                desc: 'Realtime global chat app',
                link: 'https://math12393.codeberg.page/global-chat/',
                icon: '💬'
            }];

            // ============ DOM REFS ============
            const projectsGrid = document.getElementById('projectsGrid');
            const searchInput = document.getElementById('searchInput');
            const toast = document.getElementById('toast');
            const donutLogo = document.getElementById('donutLogo');
            const themeToggle = document.getElementById('themeToggle');
            const greetingBar = document.getElementById('greetingBar');
            const greetingText = document.getElementById('greetingText');
            const liveTime = document.getElementById('liveTime');
            const canvas = document.getElementById('sprinkles-canvas');
            const ctx = canvas.getContext('2d');

            // ============ RENDER CARDS ============
            function renderCards(filter = '') {
                const filtered = projects.filter(p =>
                    p.name.toLowerCase().includes(filter.toLowerCase()) ||
                    p.desc.toLowerCase().includes(filter.toLowerCase())
                );

                if (filtered.length === 0) {
                    projectsGrid.innerHTML =
                        '<div class="no-results">🍩 No projects found... try a different search!</div>';
                } else {
                    projectsGrid.innerHTML = filtered.map((p, i) => `
                <a href="${p.link}" class="project-card" target="_blank" rel="noopener" data-index="${i}" title="Visit: ${p.name}">
                  <div class="card-sprinkles">
                    <span class="card-sprinkle-dot"></span>
                    <span class="card-sprinkle-dot"></span>
                    <span class="card-sprinkle-dot"></span>
                    <span class="card-sprinkle-dot"></span>
                    <span class="card-sprinkle-dot"></span>
                  </div>
                  <span class="project-icon">${p.icon}</span>
                  <span class="project-name">${p.name}</span>
                  <span class="project-desc">${p.desc}</span>
                  <span class="project-link-hint">→ Visit Site</span>
                </a>
              `).join('');
                }

                // Attach ripple effect to new cards
                document.querySelectorAll('.project-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        createRipple(e, this);
                        const name = this.querySelector('.project-name')?.textContent || 'Project';
                        showToast(`🍩 Opening ${name}...`);
                    });
                });
            }

            // ============ RIPPLE EFFECT ============
            function createRipple(e, el) {
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                const rect = el.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
                el.appendChild(ripple);
                ripple.addEventListener('animationend', () => ripple.remove());
            }

            // ============ TOAST ============
            let toastTimeout;

            function showToast(msg) {
                clearTimeout(toastTimeout);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 1800);
            }

            // ============ SEARCH ============
            searchInput.addEventListener('input', () => {
                renderCards(searchInput.value);
            });

            // ============ DONUT CLICK ============
            let clickCount = 0;
            donutLogo.addEventListener('click', () => {
                clickCount++;
                if (clickCount % 5 === 0) {
                    showToast('🍩🍩🍩 DONUT PARTY! 🍩🍩🍩');
                    // Burst extra sprinkles
                    for (let i = 0; i < 15; i++) {
                        setTimeout(() => spawnBurstSprinkle(), i * 40);
                    }
                } else if (clickCount % 3 === 0) {
                    showToast('🍩 Sweet click!');
                }
                // Animate donut
                donutLogo.style.animation = 'none';
                void donutLogo.offsetWidth;
                donutLogo.style.animation = 'floatDonut 0.6s ease-in-out';
                setTimeout(() => {
                    donutLogo.style.animation = 'floatDonut 3s ease-in-out infinite';
                }, 600);
            });

            // ============ THEME TOGGLE ============
            function updateThemeIcon() {
                const isLight = document.body.classList.contains('light');
                themeToggle.textContent = isLight ? '☀️' : '🌙';
                // Update donut inner circle color for light mode
                const innerCircle = document.querySelector('.donut-logo svg circle:nth-child(2)');
                if (innerCircle) {
                    innerCircle.setAttribute('fill', isLight ? '#fef9f3' : '#1a1a2e');
                }
            }

            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('light');
                updateThemeIcon();
                // Update all donut inner circles
                const innerCircle = document.querySelector('.donut-logo svg circle:nth-child(2)');
                if (innerCircle) {
                    const isLight = document.body.classList.contains('light');
                    innerCircle.setAttribute('fill', isLight ? '#fef9f3' : '#1a1a2e');
                }
                showToast(document.body.classList.contains('light') ? '☀️ Light mode — fresh glaze!' :
                    '🌙 Dark mode — chocolate night!');
            });

            // ============ LIVE CLOCK & GREETING ============
            function updateClock() {
                const now = new Date();
                const hours = now.getHours();
                const mins = now.getMinutes().toString().padStart(2, '0');
                const secs = now.getSeconds().toString().padStart(2, '0');
                liveTime.textContent = `${hours.toString().padStart(2, '0')}:${mins}:${secs}`;

                let greeting;
                if (hours < 6) greeting = '🌙 Late night donut craving?';
                else if (hours < 9) greeting = '🌅 Good morning! Fresh donuts await!';
                else if (hours < 12) greeting = '☀️ Good morning!';
                else if (hours < 17) greeting = '🍩 Good afternoon! Treat yourself!';
                else if (hours < 21) greeting = '🌆 Good evening! Sweet hour!';
                else greeting = '🌙 Good night! Dream of donuts!';
                greetingText.textContent = greeting;
            }
            updateClock();
            setInterval(updateClock, 1000);

            // ============ FLOATING SPRINKLES CANVAS ============
            let sprinkleParticles = [];
            const sprinkleColors = ['#ffe259', '#56ccf2', '#7bed9f', '#c471ed', '#ff9a56', '#ffffff', '#ff6b9d',
            '#f7c5cc'];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', () => {
                resizeCanvas();
                // Keep particles within bounds
                sprinkleParticles.forEach(p => {
                    if (p.x > canvas.width) p.x = canvas.width;
                    if (p.y > canvas.height) p.y = canvas.height;
                });
            });

            function createSprinkle(x, y) {
                return {
                    x: x ?? Math.random() * canvas.width,
                    y: y ?? Math.random() * canvas.height,
                    size: Math.random() * 5 + 2,
                    speedX: (Math.random() - 0.5) * 0.4,
                    speedY: (Math.random() - 0.5) * 0.4 - 0.3,
                    color: sprinkleColors[Math.floor(Math.random() * sprinkleColors.length)],
                    rotation: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 2,
                    opacity: Math.random() * 0.7 + 0.3,
                    life: Math.random() * 300 + 200,
                    maxLife: 500,
                };
            }

            // Initialize particles
            for (let i = 0; i < 55; i++) {
                sprinkleParticles.push(createSprinkle());
            }

            function spawnBurstSprinkle() {
                const cx = window.innerWidth / 2 + (Math.random() - 0.5) * 200;
                const cy = window.innerHeight / 2 + (Math.random() - 0.5) * 150;
                for (let i = 0; i < 8; i++) {
                    const p = createSprinkle(cx, cy);
                    p.speedX = (Math.random() - 0.5) * 3;
                    p.speedY = (Math.random() - 0.5) * 3 - 1.5;
                    p.size = Math.random() * 6 + 3;
                    p.life = 150;
                    p.maxLife = 150;
                    sprinkleParticles.push(p);
                }
            }

            function animateSprinkles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                sprinkleParticles = sprinkleParticles.filter(p => {
                    p.x += p.speedX;
                    p.y += p.speedY;
                    p.rotation += p.rotSpeed;
                    p.life--;

                    // Wrap around edges
                    if (p.x < -20) p.x = canvas.width + 20;
                    if (p.x > canvas.width + 20) p.x = -20;
                    if (p.y < -20) p.y = canvas.height + 20;
                    if (p.y > canvas.height + 20) p.y = -20;

                    // Fade out near end of life
                    let alpha = p.opacity;
                    if (p.life < 60) alpha = p.opacity * (p.life / 60);

                    // Draw sprinkle
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.globalAlpha = Math.max(0, alpha);
                    ctx.fillStyle = p.color;
                    // Rounded rectangle sprinkle
                    const s = p.size;
                    ctx.beginPath();
                    ctx.roundRect(-s / 2, -s / 4, s, s / 2, s / 4);
                    ctx.fill();
                    ctx.restore();

                    return p.life > 0;
                });

                // Maintain particle count
                while (sprinkleParticles.length < 50) {
                    sprinkleParticles.push(createSprinkle());
                }

                requestAnimationFrame(animateSprinkles);
            }
            animateSprinkles();

            // ============ INIT ============
            renderCards();
            updateThemeIcon();

            // Initial inner circle color sync
            const innerCircle = document.querySelector('.donut-logo svg circle:nth-child(2)');
            if (innerCircle) {
                innerCircle.setAttribute('fill', document.body.classList.contains('light') ? '#fef9f3' : '#1a1a2e');
            }

            // ============ KEYBOARD SHORTCUT ============
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                }
                if (e.key === 'Escape') {
                    searchInput.blur();
                    searchInput.value = '';
                    renderCards();
                }
                // Ctrl+Shift+D for dark/light toggle
                if (e.ctrlKey && e.shiftKey && e.key === 'D') {
                    e.preventDefault();
                    themeToggle.click();
                }
            });

            console.log('🍩 Donut Club Portal ready!');
            console.log('  Type "/" to search, "Esc" to clear');
            console.log('  Click the donut for surprises!');
            console.log('  Ctrl+Shift+D to toggle theme');
            console.log('  Enjoy your sweet tools! 🍩');
        })();
    </script>
</body>
</html>
