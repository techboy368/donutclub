@keyframes floatDonut{0%,100%{transform:translateY(0px);-webkit-transform:translateY(0px);}30%{transform:translateY(-18px);-webkit-transform:translateY(-18px);}60%{transform:translateY(-6px);-webkit-transform:translateY(-6px);}85%{transform:translateY(-14px);-webkit-transform:translateY(-14px);}}
@-webkit-keyframes floatDonut{0%,100%{-webkit-transform:translateY(0px);}30%{-webkit-transform:translateY(-18px);}60%{-webkit-transform:translateY(-6px);}85%{-webkit-transform:translateY(-14px);}}
@keyframes gradientShift{0%,100%{background-position:0% 50%;}25%{background-position:100% 0%;}50%{background-position:100% 100%;}75%{background-position:0% 100%;}}
@-webkit-keyframes gradientShift{0%,100%{background-position:0% 50%;}25%{background-position:100% 0%;}50%{background-position:100% 100%;}75%{background-position:0% 100%;}}
.infoCard{background:rgba(22,33,62,0.55);border:1.5px solid rgba(255,255,255,0.06);border-radius:18px;padding:16px 18px;box-shadow:0 8px 32px rgba(0,0,0,0.25);transition:all 0.35s;text-align:left;}
.infoCard:hover{border-color:rgba(255,107,157,0.3);transform:translateY(-3px);}
.infoLabel{font-size:0.68rem;letter-spacing:1.6px;text-transform:uppercase;color:#ff6b9d;font-weight:800;margin-bottom:10px;}
.newsItem{display:block;font-size:0.82rem;color:#c9b8a8;text-decoration:none;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);transition:all 0.3s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.newsItem:hover{background:rgba(255,107,157,0.12);border-color:rgba(255,107,157,0.35);color:#f5e6d3;transform:translateX(4px);}
#search::placeholder{color:#8a7b6e;}
#search:focus{border-color:rgba(255,107,157,0.7);box-shadow:0 0 0 4px rgba(255,107,157,0.12),0 4px 16px rgba(0,0,0,0.3);}
body.light{background:#fef9f3!important;color:#3d2c1e!important;}
body.light #sub{color:#7a6a5c;}body.light #tag{color:#a09080;}body.light #dq{color:#c4728a;}body.light #gr,body.light #ipinfo,body.light #dev{color:#8a7a6a;}body.light #tm{color:#e0557a;}body.light #ftr{color:#a09080;}body.light .footer a{color:#e0557a;}body.light #top{background:rgba(255,255,255,0.7);border-color:rgba(255,107,157,0.3);color:#3d2c1e;}body.light #th{background:rgba(255,255,255,0.7);border-color:rgba(255,107,157,0.3);color:#3d2c1e;}body.light #langSel{background:rgba(255,255,255,0.7);border-color:rgba(255,107,157,0.3);color:#3d2c1e;}body.light #rnd,body.light #share,body.light a[href='https://discord.gg/BVXUXSWNBN']{background:rgba(255,255,255,0.7)!important;border-color:rgba(255,107,157,0.3)!important;color:#3d2c1e!important;}
body.light .infoCard{background:rgba(255,255,255,0.8);border-color:rgba(0,0,0,0.07);box-shadow:0 8px 28px rgba(0,0,0,0.08);}
body.light #today,body.light #weather,body.light #joke{color:#3d2c1e!important;}
body.light #weatherDesc{color:#7a6a5c;}
body.light .newsItem{background:rgba(0,0,0,0.03);border-color:rgba(0,0,0,0.06);color:#7a6a5c;}
body.light .newsItem:hover{background:rgba(255,107,157,0.12);border-color:rgba(255,107,157,0.3);color:#3d2c1e;}
body.light #search{background:rgba(255,255,255,0.8);border-color:rgba(255,107,157,0.3);color:#3d2c1e;}
body.light #search::placeholder{color:#a09080;}
body.light a[style*='background:#16213e']{background:#ffffff!important;box-shadow:0 8px 28px rgba(0,0,0,0.08)!important;}
body.light a[style*='background:#16213e']:hover{background:#fff5ee!important;box-shadow:0 16px 40px rgba(0,0,0,0.1),0 0 40px rgba(255,107,157,0.2)!important;}
body.light a[style*='background:#16213e'] span[style*='color:#f5e6d3']{color:#3d2c1e!important;}
body.light a[style*='background:#16213e'] span[style*='color:#a89b8a']{color:#7a6a5c!important;}
body.light a[style*='background:#16213e'] span[style*='color:#7bed9f']{background:rgba(0,180,100,0.1)!important;color:#2e8b57!important;}
</style>
</body>
