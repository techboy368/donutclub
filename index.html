<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍩 Donut Club</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        /* ---------- THEMING ---------- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #f0e6d3;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            cursor: default;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body.light {
            background: #fef9f3;
            color: #3d2c1e;
        }

        #sprinkles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .main-container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        .header {
            text-align: center;
            padding: 40px 20px 20px;
            position: relative;
        }

        .donut-logo {
            display: inline-block;
            position: relative;
            cursor: pointer;
            animation: floatDonut 3s ease-in-out infinite;
            -webkit-animation: floatDonut 3s ease-in-out infinite;
        }
        .donut-logo:active {
            transform: scale(0.9);
            -webkit-transform: scale(0.9);
        }

        @keyframes floatDonut {
            0%, 100% { transform: translateY(0px); -webkit-transform: translateY(0px); }
            30% { transform: translateY(-18px); -webkit-transform: translateY(-18px); }
            60% { transform: translateY(-6px); -webkit-transform: translateY(-6px); }
            85% { transform: translateY(-14px); -webkit-transform: translateY(-14px); }
        }
        @-webkit-keyframes floatDonut {
            0%, 100% { -webkit-transform: translateY(0px); }
            30% { -webkit-transform: translateY(-18px); }
            60% { -webkit-transform: translateY(-6px); }
            85% { -webkit-transform: translateY(-14px); }
        }

        .donut-logo svg {
            width: 100px;
            height: 100px;
            filter: drop-shadow(0 10px 30px rgba(255, 107, 157, 0.5));
            -webkit-filter: drop-shadow(0 10px 30px rgba(255, 107, 157, 0.5));
            transition: filter 0.4s, -webkit-filter 0.4s;
        }
        .donut-logo:hover svg {
            filter: drop-shadow(0 14px 40px rgba(255, 107, 157, 0.75));
            -webkit-filter: drop-shadow(0 14px 40px rgba(255, 107, 157, 0.75));
        }

        .frosting-drip {
            animation: dripPulse 2s ease-in-out infinite;
            -webkit-animation: dripPulse 2s ease-in-out infinite;
            transform-origin: top center;
            -webkit-transform-origin: top center;
        }
        @keyframes dripPulse {
            0%, 100% { d: path('M 35 48 Q 35 52 38 54 Q 41 56 38 60'); }
            50% { d: path('M 35 48 Q 35 52 38 55 Q 41 58 38 63'); }
        }
        @-webkit-keyframes dripPulse {
            0%, 100% { d: path('M 35 48 Q 35 52 38 54 Q 41 56 38 60'); }
            50% { d: path('M 35 48 Q 35 52 38 55 Q 41 58 38 63'); }
        }

        .title {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ff6b9d, #ff9a56, #ff6b9d, #c471ed);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease-in-out infinite;
            -webkit-animation: gradientShift 4s ease-in-out infinite;
            margin-top: 8px;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            25% { background-position: 100% 0%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
        }
        @-webkit-keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            25% { background-position: 100% 0%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
        }

        .subtitle {
            font-size: 1.1rem;
            color: #c9b8a8;
            margin-top: 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }
        body.light .subtitle { color: #7a6a5c; }

        .tagline {
            font-size: 0.9rem;
            color: #8a7b6e;
            margin-top: 6px;
            font-style: italic;
        }
        body.light .tagline { color: #a09080; }

        .donut-quote {
            font-size: 0.9rem;
            color: #f7c5cc;
            margin-top: 6px;
            font-weight: 500;
            min-height: 1.2em;
        }
        body.light .donut-quote { color: #c4728a; }

        /* ---------- BUTTON ROW ---------- */
        .action-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0 10px;
            z-index: 2;
            position: relative;
        }
        .action-btn {
            background: rgba(22, 33, 62, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 107, 157, 0.35);
            border-radius: 25px;
            color: #f0e6d3;
            padding: 8px 18px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.35s;
            font-size: 0.9rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        body.light .action-btn {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 107, 157, 0.3);
            color: #3d2c1e;
        }
        .action-btn:hover {
            border-color: #ff6b9d;
            box-shadow: 0 0 25px rgba(255, 107, 157, 0.35);
            transform: translateY(-2px);
            -webkit-transform: translateY(-2px);
        }
        .action-btn:active {
            transform: scale(0.95);
            -webkit-transform: scale(0.95);
        }

        /* ---------- INFO BAR ---------- */
        .info-bar {
            text-align: center;
            margin: 10px 0 20px;
            font-size: 1rem;
            color: #b8a594;
            letter-spacing: 1px;
            transition: all 0.5s;
        }
        body.light .info-bar { color: #8a7a6a; }
        .info-bar .time {
            font-weight: 700;
            color: #ff6b9d;
            font-size: 1.3rem;
        }
        body.light .info-bar .time { color: #e0557a; }
        .weather-widget {
            font-weight: 600;
            color: #f7c5cc;
            margin-left: 12px;
        }
        body.light .weather-widget { color: #d46a7e; }
        .device-badge {
            display: inline-block;
            margin-left: 12px;
            font-size: 0.8rem;
            color: #b8a594;
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 10px;
            border-radius: 15px;
        }
        body.light .device-badge {
            background: rgba(0,0,0,0.05);
            color: #6a5c4e;
        }
        .visitor-count {
            margin-left: 12px;
            font-size: 0.8rem;
            color: #b8a594;
        }
        body.light .visitor-count { color: #6a5c4e; }

        .search-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 28px;
            position: relative;
            z-index: 2;
        }
        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 14px 22px 14px 48px;
            border-radius: 50px;
            border: 2px solid rgba(255, 107, 157, 0.35);
            background: rgba(22, 33, 62, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #f0e6d3;
            font-size: 1rem;
            letter-spacing: 0.5px;
            transition: all 0.35s;
            outline: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }
        body.light .search-input {
            background: rgba(255, 255, 255, 0.8);
            color: #3d2c1e;
            border-color: rgba(255, 107, 157, 0.3);
        }
        .search-input::placeholder { color: #6b5e52; }
        body.light .search-input::placeholder { color: #b0a090; }
        .search-input:focus {
            border-color: #ff6b9d;
            box-shadow: 0 0 0 6px rgba(255, 107, 157, 0.1), 0 8px 30px rgba(0, 0, 0, 0.35);
            background: rgba(30, 45, 80, 0.9);
        }
        .search-icon {
            position: absolute;
            left: calc(50% - 230px);
            top: 50%;
            transform: translateY(-50%);
            -webkit-transform: translateY(-50%);
            font-size: 1.2rem;
            pointer-events: none;
            z-index: 3;
            color: #8a7b6e;
            transition: color 0.3s;
        }
        @media (max-width: 600px) {
            .search-icon { left: 28px; }
            .search-input { padding-left: 44px; }
        }
        .search-input:focus ~ .search-icon,
        .search-wrap:focus-within .search-icon {
            color: #ff6b9d;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            position: relative;
            z-index: 1;
        }
        .project-card {
            background: #16213e;
            border-radius: 20px;
            padding: 24px 22px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        body.light .project-card {
            background: #ffffff;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }
        .project-card:hover {
            background: #1e2d50;
            border-color: rgba(255, 107, 157, 0.4);
            transform: translateY(-6px);
            -webkit-transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 107, 157, 0.3);
            z-index: 5;
        }
        body.light .project-card:hover {
            background: #fff5ee;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.1), 0 0 40px rgba(255, 107, 157, 0.2);
        }
        .project-card:active {
            transform: scale(0.97);
            -webkit-transform: scale(0.97);
        }
        .project-card::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 107, 157, 0.25) 0%, transparent 70%);
            pointer-events: none;
            transition: all 0.5s;
            opacity: 0.6;
        }
        .project-card:hover::before {
            top: -20px;
            right: -20px;
            width: 100px;
            height: 100px;
            opacity: 0.9;
            background: radial-gradient(circle, rgba(255, 154, 86, 0.35) 0%, transparent 70%);
        }
        .card-sprinkles {
            position: absolute;
            top: 12px;
            right: 16px;
            display: flex;
            gap: 5px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .project-card:hover .card-sprinkles { opacity: 1; }
        .card-sprinkle-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            animation: sprinklePop 0.5s ease-out forwards;
            -webkit-animation: sprinklePop 0.5s ease-out forwards;
        }
        .card-sprinkle-dot:nth-child(1) { background: #ffe259; animation-delay: 0s; }
        .card-sprinkle-dot:nth-child(2) { background: #56ccf2; animation-delay: 0.07s; }
        .card-sprinkle-dot:nth-child(3) { background: #7bed9f; animation-delay: 0.14s; }
        .card-sprinkle-dot:nth-child(4) { background: #c471ed; animation-delay: 0.21s; }
        .card-sprinkle-dot:nth-child(5) { background: #ff9a56; animation-delay: 0.28s; }

        @keyframes sprinklePop {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            60% { transform: scale(1.6) rotate(180deg); opacity: 1; }
            100% { transform: scale(1) rotate(360deg); opacity: 1; }
        }
        @-webkit-keyframes sprinklePop {
            0% { -webkit-transform: scale(0) rotate(0deg); opacity: 0; }
            60% { -webkit-transform: scale(1.6) rotate(180deg); opacity: 1; }
            100% { -webkit-transform: scale(1) rotate(360deg); opacity: 1; }
        }

        .project-icon {
            font-size: 2.2rem;
            transition: transform 0.4s;
            -webkit-transition: -webkit-transform 0.4s;
            display: inline-block;
        }
        .project-card:hover .project-icon {
            transform: scale(1.2) rotate(-10deg);
            -webkit-transform: scale(1.2) rotate(-10deg);
        }
        .project-name {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.3px;
            color: #f5e6d3;
            position: relative;
            z-index: 1;
        }
        body.light .project-name { color: #3d2c1e; }
        .project-desc {
            font-size: 0.85rem;
            color: #a89b8a;
            line-height: 1.4;
            position: relative;
            z-index: 1;
        }
        body.light .project-desc { color: #7a6a5c; }
        .project-status {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #7bed9f;
            background: rgba(123, 237, 159, 0.15);
            padding: 2px 8px;
            border-radius: 12px;
            margin-top: 2px;
        }
        body.light .project-status {
            background: rgba(0, 180, 100, 0.1);
            color: #2e8b57;
        }
        .project-link-hint {
            font-size: 0.75rem;
            color: #ff6b9d;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(8px);
            -webkit-transform: translateY(8px);
            transition: all 0.35s;
            -webkit-transition: all 0.35s;
            position: relative;
            z-index: 1;
        }
        .project-card:hover .project-link-hint {
            opacity: 1;
            transform: translateY(0);
            -webkit-transform: translateY(0);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            -webkit-transform: translateX(-50%) translateY(100px);
            background: #ff6b9d;
            color: #1a1a2e;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            letter-spacing: 0.5px;
            z-index: 999;
            pointer-events: none;
            box-shadow: 0 10px 35px rgba(255, 107, 157, 0.5);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            -webkit-transition: -webkit-transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 0.95rem;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            -webkit-transform: translateX(-50%) translateY(0);
        }

        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 90;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(22, 33, 62, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 107, 157, 0.35);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            color: #f0e6d3;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            -webkit-transition: opacity 0.3s, -webkit-transform 0.3s;
            pointer-events: none;
        }
        body.light .back-to-top {
            background: rgba(255,255,255,0.7);
            border-color: rgba(255,107,157,0.3);
            color: #3d2c1e;
        }
        .back-to-top.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .back-to-top:hover {
            border-color: #ff6b9d;
            box-shadow: 0 0 25px rgba(255,107,157,0.35);
            transform: translateY(-3px);
            -webkit-transform: translateY(-3px);
        }

        .footer {
            text-align: center;
            padding: 30px 20px 10px;
            color: #5a4f44;
            font-size: 0.8rem;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        body.light .footer { color: #a09080; }
        .footer span { color: #ff6b9d; font-weight: 700; }
        .footer a {
            color: #ff6b9d;
            text-decoration: none;
            margin-left: 8px;
        }
        .copy-email-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #ff6b9d;
            font-size: 0.9rem;
            margin-left: 4px;
            vertical-align: middle;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(22, 33, 62, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 107, 157, 0.35);
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.35s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            color: #f0e6d3;
        }
        body.light .theme-toggle {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 107, 157, 0.3);
            color: #3d2c1e;
        }
        .theme-toggle:hover {
            border-color: #ff6b9d;
            box-shadow: 0 0 25px rgba(255, 107, 157, 0.35);
            transform: rotate(20deg);
            -webkit-transform: rotate(20deg);
        }
        .theme-toggle:active {
            transform: scale(0.9) rotate(-20deg);
            -webkit-transform: scale(0.9) rotate(-20deg);
        }

        .lang-selector {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(22, 33, 62, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 107, 157, 0.35);
            border-radius: 25px;
            padding: 6px 12px;
            font-size: 0.9rem;
            color: #f0e6d3;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        body.light .lang-selector {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 107, 157, 0.3);
            color: #3d2c1e;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #8a7b6e;
            font-size: 1.1rem;
            grid-column: 1 / -1;
            animation: fadeInUp 0.5s ease;
            -webkit-animation: fadeInUp 0.5s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); -webkit-transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); -webkit-transform: translateY(0); }
        }
        @-webkit-keyframes fadeInUp {
            from { opacity: 0; -webkit-transform: translateY(20px); }
            to { opacity: 1; -webkit-transform: translateY(0); }
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 107, 157, 0.4);
            transform: scale(0);
            -webkit-transform: scale(0);
            animation: rippleEffect 0.7s ease-out forwards;
            -webkit-animation: rippleEffect 0.7s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleEffect {
            to { transform: scale(6); opacity: 0; -webkit-transform: scale(6); }
        }
        @-webkit-keyframes rippleEffect {
            to { -webkit-transform: scale(6); opacity: 0; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 107, 157, 0.33); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 107, 157, 0.6); }

        @media (max-width: 600px) {
            .projects-grid { grid-template-columns: 1fr; gap: 14px; }
            .header { padding: 20px 10px 10px; }
            .donut-logo svg { width: 70px; height: 70px; }
            .title { font-size: 2rem; }
            .project-card { padding: 18px 16px; border-radius: 16px; }
        }
    </style>
</head>
<body>

    <canvas id="sprinkles-canvas"></canvas>

    <select class="lang-selector" id="langSelector" aria-label="Select language">
        <option value="en">🇬🇧 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="ja">🇯🇵 日本語</option>
    </select>

    <button class="theme-toggle" id="themeToggle" title="Toggle light/dark mode" aria-label="Toggle theme">🌙</button>

    <div class="main-container">
        <header class="header">
            <div class="donut-logo" id="donutLogo" title="Click me! 🍩">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="42" fill="#d4956b" stroke="#8b5e3c" stroke-width="3"/>
                    <circle cx="50" cy="50" r="16" fill="#1a1a2e" stroke="#8b5e3c" stroke-width="2" class="hole-color"/>
                    <path d="M 12 38 Q 8 50 14 62 Q 20 78 40 84 Q 55 88 65 80 Q 78 70 82 55 Q 88 40 80 28 Q 70 14 50 10 Q 30 8 18 22 Z" fill="#ff6b9d" opacity="0.85"/>
                    <path d="M 28 42 Q 26 50 30 55 Q 34 58 32 64" fill="#ff6b9d" stroke="#e0557a" stroke-width="1.5" stroke-linecap="round" class="frosting-drip"/>
                    <path d="M 62 38 Q 60 46 64 52 Q 67 56 65 61" fill="#ff6b9d" stroke="#e0557a" stroke-width="1.5" stroke-linecap="round" class="frosting-drip" style="animation-delay:0.8s;-webkit-animation-delay:0.8s;"/>

        if (!window.requestAnimationFrame) {
            window.requestAnimationFrame = function(callback) {
                var currTime = new Date().getTime();
                var timeToCall = Math.max(0, 16 - (currTime - lastTime));
                var id = window.setTimeout(function() { callback(currTime + timeToCall); }, timeToCall);
                lastTime = currTime + timeToCall;
                return id;
            };

    function createRipple(e, el) {
        var ripple = document.createElement('span');
        ripple.className = 'ripple';
        var rect = el.getBoundingClientRect();
        var size = Math.max(rect.width, rect.height);
        ripple.style.width = size + 'px';
        ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
        ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
        el.appendChild(ripple);
        setTimeout(function() {
            if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
        }, 700);
    }

    // ========== WEATHER ==========
    function fetchWeather() {
        var weatherEl = document.getElementById('weatherWidget');
        weatherEl.textContent = translations[currentLang].weatherLoading;
        function fetchCoords(lat, lon) {
            var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current_weather=true';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            var temp = data.current_weather.temperature;
                            var code = data.current_weather.weathercode;
                            var icon = getWeatherIcon(code);
                            weatherEl.textContent = icon + ' ' + temp + '°C';
                        } catch(e) {
                            weatherEl.textContent = translations[currentLang].weatherError;
                        }
                    } else {
                        weatherEl.textContent = translations[currentLang].weatherError;
                    }
                }
            };
            xhr.send();
        }
        function getWeatherIcon(code) {
            if (code <= 3) return '☀️';
            if (code <= 48) return '🌫️';
            if (code <= 57) return '🌧️';
            if (code <= 67) return '🌧️';
            if (code <= 77) return '❄️';
            if (code <= 82) return '🌧️';
            if (code <= 86) return '❄️';
            return '⛈️';
        }
        var defaultLat = 40.7128, defaultLon = -74.0060;
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(pos) { fetchCoords(pos.coords.latitude, pos.coords.longitude); },
                function() { fetchCoords(defaultLat, defaultLon); },
                { timeout: 5000 }
            );
        } else {
            fetchCoords(defaultLat, defaultLon);
        }
    }

        else if (ua.indexOf('Mac OS X') !== -1) os = 'macOS';
        else if (ua.indexOf('Linux') !== -1) os = 'Linux';
        else if (ua.indexOf('Android') !== -1) os = 'Android';
        else if (ua.indexOf('iOS') !== -1 || ua.indexOf('iPhone') !== -1 || ua.indexOf('iPad') !== -1) os = 'iOS';

        if (ua.indexOf('Firefox') !== -1) browser = 'Firefox';
        else if (ua.indexOf('Edg/') !== -1) browser = 'Edge';

        else if (ua.indexOf('MSIE') !== -1 || ua.indexOf('Trident') !== -1) browser = 'Internet Explorer';

        return (os === 'Android' || os === 'iOS' ? '📱 ' : '🖥️ ') + os + ' · ' + browser;

    // ========== SPRINKLES CANVAS ==========
    function initSprinkles() {
        var canvas = document.getElementById('sprinkles-canvas');
        if (!canvas.getContext) {
            canvas.style.display = 'none';
            return;
        }
        var ctx = canvas.getContext('2d');
        var particles = [];
        var colors = ['#ffe259', '#56ccf2', '#7bed9f', '#c471ed', '#ff9a56', '#ffffff', '#ff6b9d', '#f7c5cc'];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        function createSprinkle(x, y) {
            return {
                x: x !== undefined ? x : Math.random() * canvas.width,
                y: y !== undefined ? y : Math.random() * canvas.height,
                size: Math.random() * 5 + 2,
                speedX: (Math.random() - 0.5) * 0.4,
                speedY: (Math.random() - 0.5) * 0.4 - 0.3,
                color: colors[Math.floor(Math.random() * colors.length)],
                rotation: Math.random() * 360,
                rotSpeed: (Math.random() - 0.5) * 2,
                opacity: Math.random() * 0.7 + 0.3,
                life: Math.random() * 300 + 200,
                maxLife: 500
            };
        }

        for (var i = 0; i < 55; i++) {
            particles.push(createSprinkle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (var i = particles.length - 1; i >= 0; i--) {
                var p = particles[i];
                p.x += p.speedX;
                p.y += p.speedY;
                p.rotation += p.rotSpeed;
                p.life--;
                if (p.x < -20) p.x = canvas.width + 20;
                if (p.x > canvas.width + 20) p.x = -20;
                if (p.y < -20) p.y = canvas.height + 20;
                if (p.y > canvas.height + 20) p.y = -20;
                var alpha = p.opacity;
                if (p.life < 60) alpha = p.opacity * (p.life / 60);
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.globalAlpha = Math.max(0, alpha);
                ctx.fillStyle = p.color;
                var s = p.size;
                ctx.fillRect(-s/2, -s/4, s, s/2);
                ctx.restore();
                if (p.life <= 0) particles.splice(i, 1);
            }
            while (particles.length < 50) particles.push(createSprinkle());
            requestAnimationFrame(animate);
        }
        animate();

        window.burstSprinkles = function() {
            var cx = window.innerWidth / 2 + (Math.random() - 0.5) * 200;
            var cy = window.innerHeight / 2 + (Math.random() - 0.5) * 150;
            for (var i = 0; i < 15; i++) {
                var p = createSprinkle(cx, cy);
                p.speedX = (Math.random() - 0.5) * 3;
                p.speedY = (Math.random() - 0.5) * 3 - 1.5;
                p.size = Math.random() * 6 + 3;
                p.life = 150;
                p.maxLife = 150;
                particles.push(p);
            }
        };
    }

                toggle.textContent = '🌙';
                var hole = document.querySelector('.hole-color');
                if (hole) hole.setAttribute('fill', '#1a1a2e');
            }
            try { localStorage.setItem('donutClubTheme', isLight ? 'light' : 'dark'); } catch(e) {}
        }
        toggle.onclick = function() {
            var isLight = body.className.indexOf('light') !== -1;
            setTheme(!isLight);
            showToast(isLight ? '🌙 Dark mode — chocolate night!' : '☀️ Light mode — fresh glaze!');
        };
        var saved = null;
        try { saved = localStorage.getItem('donutClubTheme'); } catch(e) {}
        setTheme(saved === 'light');
    }

    // ========== DONUT CLICK ==========
    function initDonutLogo() {
        var clickCount = 0;
        document.getElementById('donutLogo').onclick = function() {
            clickCount++;
            if (clickCount % 5 === 0) {
                showToast(translations[currentLang].toastParty);
                if (window.burstSprinkles) burstSprinkles();
            } else if (clickCount % 3 === 0) {
                showToast(translations[currentLang].toastSweet);
            }
            var logo = document.getElementById('donutLogo');
            logo.style.animation = 'none';
            void logo.offsetWidth;
            logo.style.animation = 'floatDonut 0.6s ease-in-out';
            setTimeout(function() {
                logo.style.animation = 'floatDonut 3s ease-in-out infinite';
            }, 600);
        };
    }

    // ========== RANDOM PROJECT ==========
    function randomProject() {
        var filteredProjects = [];
        var filter = document.getElementById('searchInput').value;
        for (var i = 0; i < projects.length; i++) {
            var p = projects[i];
            if (p.name.toLowerCase().indexOf(filter.toLowerCase()) !== -1 ||
                p.desc.toLowerCase().indexOf(filter.toLowerCase()) !== -1) {
                filteredProjects.push(p);
            }
        }
        if (filteredProjects.length === 0) {
            showToast(translations[currentLang].noResults);
            return;
        }
        var randomIndex = Math.floor(Math.random() * filteredProjects.length);
        var chosen = filteredProjects[randomIndex];
        showToast(translations[currentLang].randomTip + chosen.name);
        window.open(chosen.link, '_blank');
    }

    // ========== COPY EMAIL ==========
    function copyEmail() {
        var email = 'wen471942@gmail.com';
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(email).then(function() {
                showToast(translations[currentLang].copySuccess);
            }).catch(function() {
                fallbackCopy(email);
            });
        } else {
            fallbackCopy(email);
        }
    }
    function fallbackCopy(text) {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showToast(translations[currentLang].copySuccess);
        } catch(e) {
            showToast('Copy failed, please email manually.');
        }
        document.body.removeChild(textarea);
    }

    // ========== SHARE PAGE ==========
    function sharePage() {
        var url = window.location.href;
        if (navigator.share) {
            navigator.share({ title: 'Donut Club', url: url }).catch(function() {});
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(function() {
                showToast(translations[currentLang].shareSuccess);
            }).catch(function() {
                fallbackCopy(url);
                showToast(translations[currentLang].shareSuccess);
            });
        } else {
            fallbackCopy(url);
            showToast(translations[currentLang].shareSuccess);
        }
    }

    // ========== BACK TO TOP ==========
    function initBackToTop() {
        var btn = document.getElementById('backToTop');
        window.onscroll = function() {
            if (window.pageYOffset > 400) {
                btn.className = 'back-to-top visible';
            } else {
                btn.className = 'back-to-top';
            }
        };
        btn.onclick = function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
    }

    // ========== KEYBOARD SHORTCUTS ==========
    function initKeyboard() {
        document.onkeydown = function(e) {
            e = e || window.event;
            var key = e.key || e.keyCode;
            if (key === '/' && document.activeElement !== document.getElementById('searchInput')) {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
            if (key === 'Escape') {
                var search = document.getElementById('searchInput');
                search.blur();
                search.value = '';
                renderCards('');
            }
            if (e.ctrlKey && e.shiftKey && (key === 'D' || key === 'd')) {
                e.preventDefault();
                document.getElementById('themeToggle').click();
            }
        };
    }

    // ========== INITIALIZATION ==========
    function init() {
        document.getElementById('deviceBadge').textContent = getDeviceInfo();
        updateVisitorDisplay();
        setRandomQuote();
        // Rotate quote every 30 seconds
        setInterval(setRandomQuote, 30000);

        initTheme();
        initDonutLogo();
        initKeyboard();
        initBackToTop();
        renderCards('');
        fetchWeather();
        updateClock();
        setInterval(updateClock, 1000);
        initSprinkles();

        var searchInput = document.getElementById('searchInput');
        searchInput.oninput = function() {
            renderCards(this.value);
        };

        var langSel = document.getElementById('langSelector');
        langSel.onchange = function() {
            setLanguage(this.value);
            setRandomQuote(); // refresh quote for new language
        };

        document.getElementById('randomProjectBtn').onclick = randomProject;
        document.getElementById('sprinkleBurstBtn').onclick = function() {
            if (window.burstSprinkles) burstSprinkles();
            showToast('🎉 Sprinkles!');
        };
        document.getElementById('shareBtn').onclick = sharePage;
        document.getElementById('copyEmailBtn').onclick = copyEmail;

        var savedLang = null;
        try { savedLang = localStorage.getItem('donutClubLang'); } catch(e) {}
        if (savedLang && translations[savedLang]) {
            setLanguage(savedLang);
        } else {
            var browserLang = (navigator.language || navigator.userLanguage || 'en').substring(0,2);
            setLanguage(translations[browserLang] ? browserLang : 'en');
        }
        // Set last updated date
        document.getElementById('lastUpdated').textContent = translations[currentLang].updatedLabel;
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(init, 1);
    } else {
        window.onload = init;
    }
    </script>
</body>
</html>
