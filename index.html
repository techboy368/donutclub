    <style>
        /* ============ RESET & BASE ============ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #f0e6d3;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        body.light {
            background: #fef9f3;
            color: #3d2c1e;
        }
        body.light .project-card {
            background: #ffffff;
        }
        body.light .project-name {
            color: #3d2c1e;
        }
        body.light .project-desc {
            color: #7a6a5c;
        }
        body.light .search-input {
            background: rgba(255, 255, 255, 0.8);
            color: #3d2c1e;
            border-color: rgba(255, 107, 157, 0.3);
        }
        body.light .search-input::placeholder {
            color: #b0a090;
        }
        body.light .greeting-bar {
            color: #8a7a6a;
        }
        body.light .greeting-bar .time {
            color: #e0557a;
        }
        body.light .subtitle {
            color: #7a6a5c;
        }
        body.light .tagline {
            color: #a09080;
        }
        body.light .footer {
            color: #a09080;
        }
        body.light .theme-toggle,
        body.light .lang-select {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 107, 157, 0.3);
            color: #3d2c1e;
        }
        body.light .donut-logo svg circle:nth-child(2) {
            fill: #fef9f3;
        }

        /* ============ CANVAS ============ */
        #sprinkles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ============ MAIN CONTAINER ============ */
        .main-container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        /* ============ HEADER ============ */
        .header {
            text-align: center;
            padding: 40px 20px 20px;
        }
        .donut-logo {
            display: inline-block;
            cursor: pointer;
            animation: floatDonut 3s ease-in-out infinite;
            -webkit-animation: floatDonut 3s ease-in-out infinite;
        }
        .donut-logo:active {
            transform: scale(0.9);
            -webkit-transform: scale(0.9);
        }
        @keyframes floatDonut {
            0%, 100% { transform: translateY(0px); -webkit-transform: translateY(0px); }
            30% { transform: translateY(-18px); -webkit-transform: translateY(-18px); }
            60% { transform: translateY(-6px); -webkit-transform: translateY(-6px); }
            85% { transform: translateY(-14px); -webkit-transform: translateY(-14px); }
        }
        @-webkit-keyframes floatDonut {
            0%, 100% { -webkit-transform: translateY(0px); }
            30% { -webkit-transform: translateY(-18px); }
            60% { -webkit-transform: translateY(-6px); }
            85% { -webkit-transform: translateY(-14px); }
        }
        .donut-logo svg {
            width: 100px;
            height: 100px;
            filter: drop-shadow(0 10px 30px rgba(255, 107, 157, 0.5));
            -webkit-filter: drop-shadow(0 10px 30px rgba(255, 107, 157, 0.5));
            transition: filter 0.4s;
        }
        .donut-logo:hover svg {
            filter: drop-shadow(0 14px 40px rgba(255, 107, 157, 0.75));
            -webkit-filter: drop-shadow(0 14px 40px rgba(255, 107, 157, 0.75));
        }
        .frosting-drip {
            animation: dripPulse 2s ease-in-out infinite;
            -webkit-animation: dripPulse 2s ease-in-out infinite;
            transform-origin: top center;
        }
        @keyframes dripPulse {
            0%, 100% { d: path('M 35 48 Q 35 52 38 54 Q 41 56 38 60'); }
            50% { d: path('M 35 48 Q 35 52 38 55 Q 41 58 38 63'); }
        }
        @-webkit-keyframes dripPulse {
            0%, 100% { d: path('M 35 48 Q 35 52 38 54 Q 41 56 38 60'); }
            50% { d: path('M 35 48 Q 35 52 38 55 Q 41 58 38 63'); }
        }
        .title {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ff6b9d, #ff9a56, #ff6b9d, #c471ed);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #ff6b9d; /* fallback */
            animation: gradientShift 4s ease-in-out infinite;
            -webkit-animation: gradientShift 4s ease-in-out infinite;
            margin-top: 8px;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            25% { background-position: 100% 0%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
        }
        @-webkit-keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            25% { background-position: 100% 0%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
        }
        .subtitle {
            font-size: 1.1rem;
            color: #c9b8a8;
            margin-top: 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }
        .tagline {
            font-size: 0.9rem;
            color: #8a7b6e;
            margin-top: 6px;
            font-style: italic;
        }

        /* ============ CONTROLS ROW (theme, lang, device badge) ============ */
        .controls-row {
            display: -ms-flexbox;
            display: flex;
            -ms-flex-align: center;
            align-items: center;
            -ms-flex-pack: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .theme-toggle, .lang-select {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(22, 33, 62, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 107, 157, 0.35);
            cursor: pointer;
            font-size: 1.3rem;
            display: -ms-flexbox;
            display: flex;
            -ms-flex-align: center;
            align-items: center;
            -ms-flex-pack: center;
            justify-content: center;
            transition: all 0.35s;
            color: #f0e6d3;
            padding: 0;
            text-align: center;
        }
        .lang-select {
            width: auto;
            padding: 0 12px;
            font-size: 1rem;
            border-radius: 50px;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="%23f0e6d3"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 14px;
            cursor: pointer;
        }
        body.light .lang-select {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="%233d2c1e"><path d="M7 10l5 5 5-5z"/></svg>');
        }
        .device-badge {
            font-size: 0.8rem;
            background: rgba(255, 107, 157, 0.15);
            border-radius: 50px;
            padding: 4px 12px;
            white-space: nowrap;
            border: 1px dashed rgba(255, 107, 157, 0.3);
        }

        /* ============ GREETING BAR ============ */
        .greeting-bar {
            text-align: center;
            margin: 10px 0 20px;
            font-size: 1rem;
            color: #b8a594;
            letter-spacing: 1px;
        }
        .greeting-bar .time {
            font-weight: 700;
            color: #ff6b9d;
            font-size: 1.3rem;
        }
        .weather-widget {
            margin-left: 8px;
            font-weight: 500;
            color: #f7c5cc;
        }

        /* ============ SEARCH ============ */
        .search-wrap {
            display: -ms-flexbox;
            display: flex;
            -ms-flex-pack: center;
            justify-content: center;
            margin-bottom: 28px;
            position: relative;
        }
        .search-icon {
            position: absolute;
            left: calc(50% - 230px);
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            pointer-events: none;
            color: #8a7b6e;
            transition: color 0.3s;
        }
        .search-input:focus ~ .search-icon,
        .search-wrap:focus-within .search-icon {
            color: #ff6b9d;
        }
        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 14px 22px;
            padding-left: 48px;
            border-radius: 50px;
            border: 2px solid rgba(255, 107, 157, 0.35);
            background: rgba(22, 33, 62, 0.8);
            backdrop-filter: blur(10px);
            color: #f0e6d3;
            font-size: 1rem;
            letter-spacing: 0.5px;
            transition: all 0.35s;
            outline: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            -webkit-appearance: none;
        }
        .search-input::placeholder {
            color: #6b5e52;
            letter-spacing: 1px;
        }
        .search-input:focus {
            border-color: #ff6b9d;
            box-shadow: 0 0 0 6px rgba(255, 107, 157, 0.1), 0 8px 30px rgba(0, 0, 0, 0.35);
            background: rgba(30, 45, 80, 0.9);
        }

        /* ============ PROJECTS ============ */
        .projects-grid {
            display: -ms-flexbox;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            -ms-flex-pack: center;
            justify-content: center;
        }
        .project-card {
            background: #16213e;
            border-radius: 20px;
            padding: 24px 22px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: -ms-flexbox;
            display: flex;
            -ms-flex-direction: column;
            flex-direction: column;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            width: calc(33.333% - 20px);
            min-width: 250px;
            -ms-flex: 1 1 auto;
            flex: 1 1 auto;
        }
        .project-card:hover {
            background: #1e2d50;
            border-color: rgba(255, 107, 157, 0.4);
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 107, 157, 0.3);
        }
        .project-card::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 107, 157, 0.25) 0%, transparent 70%);
            pointer-events: none;
            transition: all 0.5s;
            opacity: 0.6;
        }
        .project-card:hover::before {
            top: -20px;
            right: -20px;
            width: 100px;
            height: 100px;
            opacity: 0.9;
            background: radial-gradient(circle, rgba(255, 154, 86, 0.35) 0%, transparent 70%);
        }
        .project-icon {
            font-size: 2.2rem;
            transition: transform 0.4s;
            display: inline-block;
        }
        .project-card:hover .project-icon {
            transform: scale(1.2) rotate(-10deg);
        }
        .project-name {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.3px;
            color: #f5e6d3;
        }
        .project-desc {
            font-size: 0.85rem;
            color: #a89b8a;
            line-height: 1.4;
        }
        .project-link-hint {
            font-size: 0.75rem;
            color: #ff6b9d;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.35s;
        }
        .project-card:hover .project-link-hint {
            opacity: 1;
            transform: translateY(0);
        }
        @media (max-width: 800px) {
            .project-card {
                width: 100%;
                min-width: auto;
            }
        }
        .no-results {
            text-align: center;
            padding: 40px;
            color: #8a7b6e;
            width: 100%;
        }

        /* ============ TOAST ============ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ff6b9d;
            color: #1a1a2e;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            z-index: 999;
            pointer-events: none;
            box-shadow: 0 10px 35px rgba(255, 107, 157, 0.5);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 0.95rem;
            white-space: nowrap;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ============ FOOTER ============ */
        .footer {
            text-align: center;
            padding: 30px 20px 10px;
            color: #5a4f44;
            font-size: 0.8rem;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        .footer a {
            color: #ff6b9d;
            text-decoration: none;
            font-weight: 700;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        /* ============ SCROLLBAR ============ */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff6b9d55;
            border-radius: 10px;
        }
    </style>
</head>

            /* ==================== PROJECTS DATA ==================== */
            var projects = [
                { key: "Tom the AI", icon: "🤖", link: "https://math12393.codeberg.page/Tom-The-Ai-Download/" },
                { key: "IPA Signer / IPA Editor", icon: "📱", link: "https://math12393.codeberg.page/IPA-SIGNER-WEN/" },
                { key: "OMNI Encoder", icon: "🔐", link: "https://math12393.codeberg.page/OMNI-ENCODER/" },
                { key: "Universal Extractor", icon: "📦", link: "https://math12393.codeberg.page/Universal-Extractor/" },
                { key: "NEXUS Architect", icon: "🏗️", link: "https://math12393.codeberg.page/Nexus-Architect/" },
                { key: "AI Website Maker", icon: "🌐", link: "https://math12393.codeberg.page/Ai-Website-Maker/" },
                { key: "Global Chat", icon: "💬", link: "https://math12393.codeberg.page/global-chat/" }
            ];

            /* ==================== DOM ELEMENTS ==================== */
            var projectsGrid = document.getElementById('projectsGrid');
            var searchInput = document.getElementById('searchInput');
            var toast = document.getElementById('toast');
            var donutLogo = document.getElementById('donutLogo');
            var themeToggle = document.getElementById('themeToggle');
            var greetingText = document.getElementById('greetingText');
            var liveTime = document.getElementById('liveTime');
            var weatherWidget = document.getElementById('weatherWidget');
            var langSelect = document.getElementById('langSelect');
            var deviceBadge = document.getElementById('deviceBadge');
            var subtitleText = document.getElementById('subtitleText');
            var taglineText = document.getElementById('taglineText');
            var canvas = document.getElementById('sprinkles-canvas');
            var ctx = canvas.getContext('2d');

            var currentLang = 'en';
            var toastTimeout = null;

            /* ==================== LANGUAGE ==================== */
            function getTranslation(key) {
                var lang = translations[currentLang] || translations['en'];
                return lang[key] || translations['en'][key] || key;
            }

            function getProjectName(projectKey) {
                var lang = translations[currentLang] || translations['en'];
                return (lang.project_names && lang.project_names[projectKey]) || projectKey;
            }

            function getProjectDesc(projectKey) {
                var lang = translations[currentLang] || translations['en'];
                return (lang.project_descs && lang.project_descs[projectKey]) || '';
            }

            function updateUITexts() {
                subtitleText.textContent = getTranslation('subtitle');
                taglineText.textContent = getTranslation('tagline');
                searchInput.placeholder = getTranslation('searchPlaceholder');
                // Update footer? static for now
                // Update greeting on next clock tick
            }

            function loadLanguage() {
                try {
                    var stored = localStorage.getItem('donutClubLang');
                    if (stored && translations[stored]) {
                        currentLang = stored;
                    } else {
                        // detect browser language
                        var navLang = (navigator.language || navigator.userLanguage || 'en').substr(0, 2);
                        if (translations[navLang]) currentLang = navLang;
                    }
                } catch(e) {}
                langSelect.value = currentLang;
                updateUITexts();
                renderCards(searchInput.value);
            }

            function saveLanguage(lang) {
                try {
                    localStorage.setItem('donutClubLang', lang);
                } catch(e) {}
            }

            langSelect.addEventListener('change', function() {
                currentLang = langSelect.value;
                saveLanguage(currentLang);
                updateUITexts();
                renderCards(searchInput.value);
                showToast('🌐 ' + currentLang.toUpperCase());
            });

            /* ==================== DEVICE DETECTION ==================== */
            function detectDevice() {
                var ua = navigator.userAgent;
                var os = '';
                var version = '';
                if (ua.indexOf('Windows NT 5.1') > -1) {
                    os = 'Windows XP';
                } else if (ua.indexOf('Windows NT 5.2') > -1) {
                    os = 'Windows XP x64';
                } else if (ua.indexOf('Windows') > -1) {
                    os = 'Windows';
                } else if (ua.indexOf('iPhone OS') > -1 || ua.indexOf('CPU iPhone OS') > -1) {
                    os = 'iOS';
                    var match = ua.match(/OS (\d+)_?(\d+)?/);
                    if (match) version = match[1] + (match[2] ? '.' + match[2] : '');
                } else if (ua.indexOf('Android') > -1) {
                    os = 'Android';
                    var match2 = ua.match(/Android (\d+\.\d+)/);
                    if (match2) version = match2[1];
                } else if (ua.indexOf('Mac OS X') > -1) {
                    os = 'macOS';
                } else if (ua.indexOf('Linux') > -1) {
                    os = 'Linux';
                }
                if (os && version) return os + ' ' + version;
                if (os) return os;
                return 'unknown device';
            }

            function showDeviceBadge() {
                var device = detectDevice();
                if (device.indexOf('unknown') === -1) {
                    deviceBadge.style.display = 'inline-block';
                    deviceBadge.textContent = '🍩 ' + device;
                }
            }

            /* ==================== WEATHER ==================== */
            function fetchWeather() {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', 'https://wttr.in/?format=%C+%t', true);
                xhr.timeout = 8000;
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200 && xhr.responseText) {
                            var weatherText = xhr.responseText.trim();
                            // wttr.in returns e.g. "☀️ +22°C"
                            weatherWidget.textContent = weatherText;
                        } else {
                            weatherWidget.textContent = '❓';
                        }
                    }
                };
                xhr.onerror = function() {
                    weatherWidget.textContent = '❓';
                };
                xhr.ontimeout = function() {
                    weatherWidget.textContent = '⏳';
                };
                xhr.send();
            }

            /* ==================== THEME ==================== */
            function applyTheme(isLight) {
                if (isLight) {
                    document.body.classList.add('light');
                    themeToggle.textContent = '☀️';
                } else {
                    document.body.classList.remove('light');
                    themeToggle.textContent = '🌙';
                }
            }

            function toggleTheme() {
                var isLight = document.body.classList.contains('light');
                applyTheme(!isLight);
                var msg = isLight ? getTranslation('toast_theme_dark') : getTranslation('toast_theme_light');
                showToast(msg);
                try {
                    localStorage.setItem('donutClubTheme', isLight ? 'dark' : 'light');
                } catch(e) {}
            }

            function loadTheme() {
                try {
                    var stored = localStorage.getItem('donutClubTheme');
                    if (stored === 'light') applyTheme(true);
                    else if (stored === 'dark') applyTheme(false);
                    else applyTheme(false); // default dark
                } catch(e) { applyTheme(false); }
            }

            themeToggle.addEventListener('click', toggleTheme);

            /* ==================== CLOCK & GREETING ==================== */
            function updateClock() {
                var now = new Date();
                var hours = now.getHours();
                var mins = ('0' + now.getMinutes()).slice(-2);
                var secs = ('0' + now.getSeconds()).slice(-2);
                liveTime.textContent = ('0' + hours).slice(-2) + ':' + mins + ':' + secs;

                var greetingKey;
                if (hours < 6) greetingKey = 'greeting_night';
                else if (hours < 12) greetingKey = 'greeting_morning';
                else if (hours < 17) greetingKey = 'greeting_afternoon';
                else if (hours < 21) greetingKey = 'greeting_evening';
                else greetingKey = 'greeting_night';
                greetingText.textContent = getTranslation(greetingKey);
            }

            /* ==================== RENDER CARDS ==================== */
            function renderCards(filter) {
                var filterLower = (filter || '').toLowerCase();
                var filtered = [];
                for (var i = 0; i < projects.length; i++) {
                    var p = projects[i];
                    var name = getProjectName(p.key);
                    var desc = getProjectDesc(p.key);
                    if (name.toLowerCase().indexOf(filterLower) !== -1 ||
                        desc.toLowerCase().indexOf(filterLower) !== -1 ||
                        p.key.toLowerCase().indexOf(filterLower) !== -1) {
                        filtered.push(p);
                    }
                }

                if (filtered.length === 0) {
                    projectsGrid.innerHTML = '<div class="no-results">' + getTranslation('noResults') + '</div>';
                } else {
                    var html = '';
                    for (var j = 0; j < filtered.length; j++) {
                        var proj = filtered[j];
                        var pName = getProjectName(proj.key);
                        var pDesc = getProjectDesc(proj.key);
                        var hint = getTranslation('visit_hint');
                        html += '<a href="' + proj.link + '" class="project-card" target="_blank" rel="noopener noreferrer" title="' + pName + '">' +
                            '<span class="project-icon">' + proj.icon + '</span>' +
                            '<span class="project-name">' + pName + '</span>' +
                            '<span class="project-desc">' + pDesc + '</span>' +
                            '<span class="project-link-hint">' + hint + '</span>' +
                            '</a>';
                    }
                    projectsGrid.innerHTML = html;

                    // attach ripple
                    var cards = document.querySelectorAll('.project-card');
                    for (var k = 0; k < cards.length; k++) {
                        (function(card) {
                            card.addEventListener('click', function(e) {
                                createRipple(e, card);
                                var nameEl = card.querySelector('.project-name');
                                var name = nameEl ? nameEl.textContent : 'Project';
                                showToast(getTranslation('toast_open') + name + '...');
                            });
                        })(cards[k]);
                    }
                }
            }

            /* ==================== RIPPLE EFFECT ==================== */
            function createRipple(e, el) {
                var ripple = document.createElement('span');
                ripple.className = 'ripple';
                ripple.style.cssText = 'position:absolute;border-radius:50%;background:rgba(255,107,157,0.4);pointer-events:none;transform:scale(0);animation:rippleEffect 0.7s ease-out forwards;';
                var rect = el.getBoundingClientRect();
                var size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
                el.appendChild(ripple);
                ripple.addEventListener('animationend', function() { ripple.remove(); });
                ripple.addEventListener('webkitAnimationEnd', function() { ripple.remove(); });
            }

            /* ==================== TOAST ==================== */
            function showToast(msg) {
                if (toastTimeout) clearTimeout(toastTimeout);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimeout = setTimeout(function() {
                    toast.classList.remove('show');
                }, 2000);
            }

            /* ==================== SEARCH ==================== */
            searchInput.addEventListener('input', function() {
                renderCards(this.value);
            });

            /* ==================== DONUT CLICK ==================== */
            var clickCount = 0;
            donutLogo.addEventListener('click', function() {
                clickCount++;
                if (clickCount % 5 === 0) {
                    showToast('🍩🍩🍩 DONUT PARTY! 🍩🍩🍩');
                    for (var i = 0; i < 15; i++) {
                        setTimeout(spawnBurstSprinkle, i * 40);
                    }
                } else if (clickCount % 3 === 0) {
                    showToast('🍩 Sweet click!');
                }
                // restart float animation
                donutLogo.style.animation = 'none';
                donutLogo.style.webkitAnimation = 'none';
                void donutLogo.offsetWidth;
                donutLogo.style.animation = 'floatDonut 0.6s ease-in-out';
                donutLogo.style.webkitAnimation = 'floatDonut 0.6s ease-in-out';
                setTimeout(function() {
                    donutLogo.style.animation = 'floatDonut 3s ease-in-out infinite';
                    donutLogo.style.webkitAnimation = 'floatDonut 3s ease-in-out infinite';
                }, 600);
            });

            /* ==================== SPRINKLES CANVAS ==================== */
            var sprinkleParticles = [];
            var sprinkleColors = ['#ffe259','#56ccf2','#7bed9f','#c471ed','#ff9a56','#ffffff','#ff6b9d','#f7c5cc'];
            var maxParticles = 55;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                if (window.innerWidth < 600) maxParticles = 25;
                else maxParticles = 55;
            }

            function createSprinkle(x, y) {
                var p = {};
                p.x = x !== undefined ? x : Math.random() * canvas.width;
                p.y = y !== undefined ? y : Math.random() * canvas.height;
                p.size = Math.random() * 5 + 2;
                p.speedX = (Math.random() - 0.5) * 0.4;
                p.speedY = (Math.random() - 0.5) * 0.4 - 0.3;
                p.color = sprinkleColors[Math.floor(Math.random() * sprinkleColors.length)];
                p.rotation = Math.random() * 360;
                p.rotSpeed = (Math.random() - 0.5) * 2;
                p.opacity = Math.random() * 0.7 + 0.3;
                p.life = 300 + Math.random() * 200;
                p.maxLife = p.life;
                return p;
            }

            function spawnBurstSprinkle() {
                var cx = canvas.width/2 + (Math.random()-0.5)*200;
                var cy = canvas.height/2 + (Math.random()-0.5)*150;
                for (var i=0; i<8; i++) {
                    var p = createSprinkle(cx, cy);
                    p.speedX = (Math.random()-0.5)*3;
                    p.speedY = (Math.random()-0.5)*3 - 1.5;
                    p.size = Math.random()*6+3;
                    p.life = 150;
                    p.maxLife = 150;
                    sprinkleParticles.push(p);
                }
            }

            function animateSprinkles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (var i = sprinkleParticles.length-1; i >= 0; i--) {
                    var p = sprinkleParticles[i];
                    p.x += p.speedX;
                    p.y += p.speedY;
                    p.rotation += p.rotSpeed;
                    p.life--;
                    if (p.x < -20) p.x = canvas.width+20;
                    if (p.x > canvas.width+20) p.x = -20;
                    if (p.y < -20) p.y = canvas.height+20;
                    if (p.y > canvas.height+20) p.y = -20;

                    var alpha = p.opacity;
                    if (p.life < 60) alpha = p.opacity * (p.life/60);
                    if (alpha < 0) alpha = 0;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI/180);
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color;
                    fillRoundRect(ctx, -p.size/2, -p.size/4, p.size, p.size/2, p.size/4);
                    ctx.restore();

                    if (p.life <= 0) {
                        sprinkleParticles.splice(i,1);
                    }
                }
                while (sprinkleParticles.length < maxParticles) {
                    sprinkleParticles.push(createSprinkle());
                }
                requestAnimFrame(animateSprinkles);
            }

            window.addEventListener('resize', function() {
                resizeCanvas();
            });

            /* ==================== KEYBOARD SHORTCUTS ==================== */
            document.addEventListener('keydown', function(e) {
                if (e.key === '/' && document.activeElement !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                }
                if (e.key === 'Escape') {
                    searchInput.blur();
                    searchInput.value = '';
                    renderCards('');
                }
                if (e.ctrlKey && e.shiftKey && e.key === 'D') {
                    e.preventDefault();
                    toggleTheme();
                }
            });

            /* ==================== INIT ==================== */
            resizeCanvas();
            // init particles
            for (var i=0; i<maxParticles; i++) {
                sprinkleParticles.push(createSprinkle());
            }
            animateSprinkles();
            loadTheme();
            loadLanguage();
            fetchWeather();
            showDeviceBadge();
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(fetchWeather, 30*60*1000); // refresh weather every 30 min
            renderCards('');

            console.log('🍩 Donut Club Portal ready!');
            console.log('  Type "/" to search, "Esc" to clear');
            console.log('  Click the donut for surprises!');
            console.log('  Ctrl+Shift+D to toggle theme');
        })();
